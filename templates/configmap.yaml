{{- include "blocky.validateQueryLogType" . -}}
{{- /*
  config.yml is rendered by passing .Values.config through toYaml, NOT by enumerating
  keys. That means every blocky config key is available without a chart change — which
  matters because since blocky v0.31 the config is validated against a generated JSON
  schema with additionalProperties: false, so this file must emit blocky's keys and
  NOTHING else.

  .Values.config carries three chart-only structures that blocky would reject. They are
  stripped below and replaced with the real thing:
    queryLog.mysql / queryLog.postgresql -> queryLog.target
    redis.enabled/.external/.image/.resources -> redis.address (+ password refs)
    empty conditional/customDNS/hostsFile.sources -> omitted entirely
  Two chart-level values feed into it, from OUTSIDE .Values.config, because everything
  under config: is Blocky's own and an unknown key there fails validation:
    .Values.extraDenylists -> appended into blocking.denylists
    "*" in a clientGroupsBlock entry -> every denylist group name

  The DSN keeps the LITERAL string $BLOCKY_DATABASE_PASSWORD. An init container in
  deployment.yaml seds the real value in from the secret at start-up; do not resolve it
  here or the password lands in the ConfigMap in plaintext.
*/ -}}
{{- $cfg := deepCopy .Values.config }}

{{- /* ---- queryLog ---- */}}
{{- if eq .Values.config.queryLog.type "none" }}
{{-   $_ := unset $cfg "queryLog" }}
{{- else }}
{{-   $ql := index $cfg "queryLog" }}
{{-   $_ := unset $ql "mysql" }}
{{-   $_ := unset $ql "postgresql" }}
{{-   if eq .Values.config.queryLog.type "mysql" }}
{{-     $_ := set $ql "target" (printf "%s:$BLOCKY_DATABASE_PASSWORD@tcp(%s:%v)/%s?charset=utf8mb4&parseTime=True&loc=Local" .Values.config.queryLog.mysql.user (include "blocky.mysql.host" .) (include "blocky.mysql.port" .) .Values.config.queryLog.mysql.database) }}
{{-   else if eq .Values.config.queryLog.type "postgresql" }}
{{-     $_ := set $ql "target" (printf "postgres://%s:$BLOCKY_DATABASE_PASSWORD@%s:%v/%s?sslmode=disable" .Values.config.queryLog.postgresql.user (include "blocky.postgresql.host" .) (include "blocky.postgresql.port" .) .Values.config.queryLog.postgresql.database) }}
{{-   end }}
{{- end }}

{{- /* ---- redis ---- */}}
{{- if .Values.config.redis.enabled }}
{{-   $r := index $cfg "redis" }}
{{-   $_ := set $r "address" (.Values.config.redis.external.address | default "localhost:6379") }}
{{-   if and .Values.config.redis.external.address .Values.config.redis.external.secretName }}
{{-     $_ := set $r "password" "$REDIS_PASSWORD" }}
{{-   end }}
{{-   if .Values.config.redis.external.sentinelAddresses }}
{{-     $_ := set $r "sentinelAddresses" .Values.config.redis.external.sentinelAddresses }}
{{-     if .Values.config.redis.external.sentinelSecretName }}
{{-       $_ := set $r "sentinelPassword" "$REDIS_SENTINEL_PASSWORD" }}
{{-     end }}
{{-   end }}
{{-   range $k := list "enabled" "external" "image" "resources" }}
{{-     $_ := unset $r $k }}
{{-   end }}
{{- else }}
{{-   $_ := unset $cfg "redis" }}
{{- end }}

{{- /* ---- omit empty optional blocks (blocky dislikes empty mappings here) ---- */}}
{{- if not (dig "conditional" "mapping" "" .Values.config) }}
{{-   $_ := unset $cfg "conditional" }}
{{- else }}
{{-   $_ := set (index $cfg "conditional") "fallbackUpstream" (dig "conditional" "fallbackUpstream" true .Values.config) }}
{{- end }}
{{- if not (dig "customDNS" "mapping" "" .Values.config) }}
{{-   $_ := unset $cfg "customDNS" }}
{{- else if not (dig "customDNS" "customTTL" "" .Values.config) }}
{{-   $_ := set (index $cfg "customDNS") "customTTL" "1h" }}
{{- end }}
{{- if and (hasKey $cfg "hostsFile") (not (dig "hostsFile" "sources" "" .Values.config)) }}
{{-   $_ := unset (index $cfg "hostsFile") "sources" }}
{{- end }}
{{- /* ---- extraDenylists ---- */}}
{{- if and .Values.extraDenylists (hasKey $cfg "blocking") }}
{{-   $b := index $cfg "blocking" }}
{{-   $lists := deepCopy (dig "denylists" dict $b) }}
{{-   range $group, $urls := .Values.extraDenylists }}
{{-     $_ := set $lists $group (concat (index $lists $group | default list) $urls) }}
{{-   end }}
{{-   $_ := set $b "denylists" $lists }}
{{- end }}
{{- /* ---- "*" in clientGroupsBlock ---- */}}
{{- if hasKey $cfg "blocking" }}
{{-   $b := index $cfg "blocking" }}
{{-   $names := keys (dig "denylists" dict $b) | sortAlpha }}
{{-   $cgb := dict }}
{{-   range $client, $groups := (dig "clientGroupsBlock" dict $b) }}
{{-     $out := list }}
{{-     range $g := (default (list) $groups) }}
{{-       if eq $g "*" }}
{{-         $out = concat $out $names }}
{{-       else }}
{{-         $out = append $out $g }}
{{-       end }}
{{-     end }}
{{-     $_ := set $cgb $client (uniq $out) }}
{{-   end }}
{{-   if $cgb }}
{{-     $_ := set $b "clientGroupsBlock" $cgb }}
{{-   end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blocky.fullname" . }}-config
  labels:
    {{- include "blocky.labels" . | nindent 4 }}
data:
  config.yml: |
{{ toYaml $cfg | indent 4 }}
