apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blocky.fullname" . }}
  labels:
    {{- include "blocky.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "blocky.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: blocky
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "blocky.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: blocky
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "blocky.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $needsConfigProcessing := or (eq .Values.config.queryLog.type "mysql") (eq .Values.config.queryLog.type "postgresql") (and .Values.config.redis.enabled .Values.config.redis.external.address .Values.config.redis.external.secretName) }}
      {{- $needsWaitForDependencies := or (eq .Values.config.queryLog.type "mysql") (eq .Values.config.queryLog.type "postgresql") }}
      {{- $needsInitContainers := or $needsConfigProcessing $needsWaitForDependencies }}
      {{- if $needsInitContainers }}
      initContainers:
        {{- if $needsWaitForDependencies }}
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              {{- if eq .Values.config.queryLog.type "mysql" }}
              until nc -z {{ include "blocky.mysql.host" . }} {{ include "blocky.mysql.port" . }}; do
                echo "Waiting for MySQL at {{ include "blocky.mysql.host" . }}:{{ include "blocky.mysql.port" . }}..."
                sleep 3
              done
              echo "MySQL is ready!"
              {{- else if eq .Values.config.queryLog.type "postgresql" }}
              until nc -z {{ include "blocky.postgresql.host" . }} {{ include "blocky.postgresql.port" . }}; do
                echo "Waiting for PostgreSQL at {{ include "blocky.postgresql.host" . }}:{{ include "blocky.postgresql.port" . }}..."
                sleep 3
              done
              echo "PostgreSQL is ready!"
              {{- end }}
        {{- end }}
        {{- if $needsConfigProcessing }}
        - name: config-processor
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /config-template/config.yml /config/config.yml
              {{- if or (eq .Values.config.queryLog.type "mysql") (eq .Values.config.queryLog.type "postgresql") }}
              sed -i "s|\$BLOCKY_DATABASE_PASSWORD|$BLOCKY_DATABASE_PASSWORD|g" /config/config.yml
              {{- end }}
              {{- if and .Values.config.redis.enabled .Values.config.redis.external.address .Values.config.redis.external.secretName }}
              sed -i "s|\$REDIS_PASSWORD|$REDIS_PASSWORD|g" /config/config.yml
              {{- end }}
              {{- if and .Values.config.redis.enabled .Values.config.redis.external.sentinelAddresses .Values.config.redis.external.sentinelSecretName }}
              sed -i "s|\$REDIS_SENTINEL_PASSWORD|$REDIS_SENTINEL_PASSWORD|g" /config/config.yml
              {{- end }}
          env:
            {{- if eq .Values.config.queryLog.type "mysql" }}
            - name: BLOCKY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blocky.mysql.secretName" . }}
                  key: {{ include "blocky.mysql.secretKey" . }}
            {{- else if eq .Values.config.queryLog.type "postgresql" }}
            - name: BLOCKY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blocky.postgresql.secretName" . }}
                  key: {{ include "blocky.postgresql.secretKey" . }}
            {{- end }}
            {{- if and .Values.config.redis.enabled .Values.config.redis.external.address .Values.config.redis.external.secretName }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.redis.external.secretName }}
                  key: {{ .Values.config.redis.external.secretKey }}
            {{- end }}
            {{- if and .Values.config.redis.enabled .Values.config.redis.external.sentinelAddresses .Values.config.redis.external.sentinelSecretName }}
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.redis.external.sentinelSecretName }}
                  key: {{ .Values.config.redis.external.sentinelSecretKey }}
            {{- end }}
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "blocky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BLOCKY_CONFIG_FILE
              {{- $needsConfigProcessing := or (eq .Values.config.queryLog.type "mysql") (eq .Values.config.queryLog.type "postgresql") (and .Values.config.redis.enabled .Values.config.redis.external.address .Values.config.redis.external.secretName) }}
              {{- if $needsConfigProcessing }}
              value: /config/config.yml
              {{- else }}
              value: /config-template/config.yml
              {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: dns-tcp
              containerPort: {{ .Values.config.ports.dns }}
              protocol: TCP
            - name: dns-udp
              containerPort: {{ .Values.config.ports.dns }}
              protocol: UDP
            - name: http
              containerPort: {{ .Values.config.ports.http }}
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- $needsConfigProcessing := or (eq .Values.config.queryLog.type "mysql") (eq .Values.config.queryLog.type "postgresql") (and .Values.config.redis.enabled .Values.config.redis.external.address .Values.config.redis.external.secretName) }}
            {{- if $needsConfigProcessing }}
            - name: config
              mountPath: /config
              readOnly: true
            {{- else }}
            - name: config-template
              mountPath: /config-template
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.blockyUI.enabled }}
        - name: blocky-ui
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.blockyUI.image.repository }}:{{ .Values.blockyUI.image.tag }}"
          imagePullPolicy: {{ .Values.blockyUI.image.pullPolicy }}
          env:
            - name: BLOCKY_API_URL
              value: "http://localhost:{{ .Values.config.ports.http }}"
            {{- range $key, $value := .Values.blockyUI.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: ui
              containerPort: {{ .Values.blockyUI.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if and .Values.config.redis.enabled (not .Values.config.redis.external.address) }}
        - name: redis
          image: "{{ .Values.config.redis.image.repository }}:{{ .Values.config.redis.image.tag }}"
          imagePullPolicy: {{ .Values.config.redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.config.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: config-template
          configMap:
            name: {{ include "blocky.fullname" . }}-config
        {{- $needsConfigProcessing := or (eq .Values.config.queryLog.type "mysql") (eq .Values.config.queryLog.type "postgresql") (and .Values.config.redis.enabled .Values.config.redis.external.address .Values.config.redis.external.secretName) }}
        {{- if $needsConfigProcessing }}
        - name: config
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
