{{- if and (eq .Values.config.queryLog.type "mysql") (not .Values.config.queryLog.mysql.external.hostname) }}
{{- if not .Values.config.queryLog.mysql.existingSecret }}
{{- $secretName := printf "%s-mysql" (include "blocky.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "blocky.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
type: Opaque
data:
  {{- if $existingSecret }}
  mysql-root-password: {{ index $existingSecret.data "mysql-root-password" }}
  mysql-password: {{ index $existingSecret.data "mysql-password" }}
  {{- else }}
  mysql-root-password: {{ randAlphaNum 16 | b64enc | quote }}
  mysql-password: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blocky.fullname" . }}-mysql-config
  labels:
    {{- include "blocky.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
data:
  my.cnf: |
{{- .Values.config.queryLog.mysql.config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blocky.fullname" . }}-mysql
  labels:
    {{- include "blocky.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
  selector:
    {{- include "blocky.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "blocky.fullname" . }}-mysql
  labels:
    {{- include "blocky.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  serviceName: {{ include "blocky.fullname" . }}-mysql
  replicas: 1
  selector:
    matchLabels:
      {{- include "blocky.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        {{- include "blocky.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mysql
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mysql
          image: "{{ .Values.config.queryLog.mysql.image.repository }}:{{ .Values.config.queryLog.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.config.queryLog.mysql.image.pullPolicy }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blocky.mysql.secretName" . }}
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: {{ .Values.config.queryLog.mysql.database }}
            - name: MYSQL_USER
              value: {{ .Values.config.queryLog.mysql.user }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blocky.mysql.secretName" . }}
                  key: mysql-password
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.config.queryLog.mysql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/my.cnf
              subPath: my.cnf
              readOnly: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "blocky.fullname" . }}-mysql-config
        {{- if not .Values.config.queryLog.mysql.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.config.queryLog.mysql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.config.queryLog.mysql.persistence.accessModes | nindent 10 }}
        {{- if .Values.config.queryLog.mysql.persistence.storageClass }}
        storageClassName: {{ .Values.config.queryLog.mysql.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.config.queryLog.mysql.persistence.size }}
  {{- end }}
{{- end }}
