name: Lint and Test Chart

on:
  pull_request:
    branches:
      - master
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'templates/**'
      - '.github/workflows/*.yaml'

jobs:
  lint:
    name: Lint Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint .

  template:
    name: Template Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Template with defaults
        run: helm template test-release . --debug

      - name: Template with blockyUI enabled
        run: |
          helm template test-release . \
            --set blockyUI.enabled=true \
            --set blockyUI.ingress.enabled=true \
            --set blockyUI.ingress.className=nginx \
            --set blockyUI.ingress.hostname=blocky.example.com

      - name: Template with custom values
        run: |
          helm template test-release . \
            --set replicaCount=3 \
            --set dnsService.type=ClusterIP \
            --set serviceMonitor.enabled=false

  kubeconform:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          helm template test-release . | kubeconform \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version 1.29.0 \
            -summary

